name: authn
version: 0.3.0
description: |
  Authentication building blocks for Crystal, framework-agnostic: BCrypt
  password hashing, JWT tokens, HTTP cookie sessions, user invitations and
  password reset over SMTP. Password policy rules live in password-policy.

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.18.1"

license: MIT

dependencies:
  # Les règles de mot de passe vivent ici, et nulle part ailleurs.
  password-policy:
    github: aloli-crystal/password-policy
    version: "~> 0.1"
  bcrypt:
    github: jgaskins/bcrypt
  email:
    github: arcage/crystal-email
    version: "~> 0.6"
  jwt:
    github: crystal-community/jwt
    version: "~> 1.6"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
